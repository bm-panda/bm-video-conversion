[bmscriptsbox]

[bmscriptsbox.info]
id = "b7e730b1-1bb3-418d-a90a-4691ca600c9b"
name = "视频格式转换"
desc = "基于 FFmpeg 的视频格式转换脚本 | 支持 mp4/mkv/avi/mov/webm/gif/m4v/flv/wmv/ts 10 种输出格式，可自定义视频编码器、分辨率、画质、帧率与音频处理方式，右键一键批量转换"
version = "1.0.1"
icon = "./imgs/img.png"

[bmscriptsbox.runtime]
language = "python"
language_version = ">=3.8"
entry = "main.py"
terminal = "inverse"
binaries = [{name = "ffmpeg"}, {name="webview-cli"}]

[bmscriptsbox.triggers.context_menu]
enabled = true
targets = ["files"]
filters = [".mp4", ".mkv", ".avi", ".mov", ".webm", ".flv", ".wmv", ".ts", ".m4v",
           ".mpg", ".mpeg", ".m2ts", ".mts", ".3gp", ".ogv", ".vob", ".rmvb", ".rm", ".asf"]

[bmscriptsbox.triggers.shortcut]
enabled = true
input_type = "files"
filters = [".mp4", ".mkv", ".avi", ".mov", ".webm", ".flv", ".wmv", ".ts", ".m4v",
           ".mpg", ".mpeg", ".m2ts", ".mts", ".3gp", ".ogv", ".vob", ".rmvb", ".rm", ".asf"]

[[bmscriptsbox.inputs]]
name = "target_paths"
type = "file"
exts = [".mp4", ".mkv", ".avi", ".mov", ".webm", ".flv", ".wmv", ".ts", ".m4v",
        ".mpg", ".mpeg", ".m2ts", ".mts", ".3gp", ".ogv", ".vob", ".rmvb", ".rm", ".asf"]
